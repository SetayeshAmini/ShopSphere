<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere | Discover Technology</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
 <div class="product-card" data-aos="fade-up">
<!-- =========================
     NAVBAR
========================= -->

<header class="site-header" id="siteHeader">

    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">

        <div class="container">

            <!-- Brand -->
            <a class="navbar-brand brand-logo" href="#home" aria-label="ShopSphere home">
                ShopSphere<span class="brand-dot">.</span>
            </a>


            <!-- Mobile Toggle -->
            <button
                class="navbar-toggler menu-toggle"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="toggle-line"></span>
                <span class="toggle-line"></span>
            </button>


            <!-- Navigation Content -->
            <div class="collapse navbar-collapse" id="mainNavbar">

                <!-- Navigation Links -->
                <ul class="navbar-nav mx-auto nav-links">

                    <li class="nav-item">
                        <a class="nav-link active" href="#home" aria-current="page">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#categories">
                            Categories
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#products">
                            Shop
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#about">
                            Our Story
                        </a>
                    </li>

                </ul>


                <!-- Navigation Actions -->
                <div class="nav-actions">

                    <!-- Search -->
                    <button
                        class="nav-icon-btn"
                        id="searchToggle"
                        type="button"
                        aria-label="Open search"
                        aria-expanded="false"
                        aria-controls="searchPanel"
                    >
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </button>


                    <!-- Wishlist -->
                    <a
                        href="#wishlist"
                        class="nav-icon-btn wishlist-link"
                        aria-label="Wishlist"
                    >
                        <i class="bi bi-heart" aria-hidden="true"></i>
                    </a>


                    <!-- Shopping Bag -->
                    <a
                        href="cart.html"
                        class="nav-icon-btn cart-link"
                        aria-label="Shopping bag, 0 items"
                    >
                        <i class="bi bi-bag" aria-hidden="true"></i>

                        <span class="cart-count" id="cartCount">0</span>
                    </a>

                </div>

            </div>

        </div>

    </nav>


     <!-- Search Panel -->
    <div class="search-panel" id="searchPanel" hidden>

        <div class="container">

            <form class="search-form" id="searchForm" role="search">

                <i class="bi bi-search search-form-icon" aria-hidden="true"></i>

                <input
                    type="search"
                    id="searchInput"
                    name="q"
                    placeholder="Search products..."
                    aria-label="Search products"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="search-close"
                    id="searchClose"
                    aria-label="Close search"
                >
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>

            </form>

        </div>

    </div>

</header>
<!-- Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!-- AOS Animation JavaScript -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<!-- Custom JavaScript -->
<script src="JS/app.js"></script>

</body>
</html>
